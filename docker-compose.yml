services:
  db:
    image: postgres:12
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/backups:/backups
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  redis:
    image: redis:6
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      bash -c "
      rm -f tmp/pids/server.pid &&
      npm install &&
      bundle exec rails server -b 0.0.0.0 -p 3000
      "
    volumes:
      - .:/app
      - ~/.ssh:/root/.ssh:ro
      - $SSH_AUTH_SOCK:/ssh-agent
      - ~/.ssh/id_rsa:/root/.ssh/id_rsa:ro
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    environment:
      REDIS_URL: redis://redis:6379/1
      RAILS_ENV: development
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME_DEVELOPMENT: bakecycle_development
      DB_NAME_TEST: bakecycle_test
      SSH_AUTH_SOCK: /ssh-agent


volumes:
  pgdata: