plugins:
  - rubocop-rails

AllCops:
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  Exclude:
    - 'db/schema.rb'
    - 'vendor/bundle/**/*'
    - 'node_modules/**/*'
    - 'bin/**/*'

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 15
  Enabled: false

Metrics/AbcSize:
  Max: 25
  Exclude:
    - "app/reports/**/*"
    - "config/**/*"
    - "**/*_spec.rb"
    - "spec/**/*"
    - "lib/**/*"
    - "db/migrate/**/*"
    - "app/controllers/api/**/*"
    - "app/models/public_client_user.rb"
    - "app/models/client.rb"
    - "app/services/**/*"
    # These report actions orchestrate request parsing and report assembly;
    # keeping that workflow together makes their public behavior legible.
    - "app/controllers/clients_controller.rb"
    - "app/controllers/products_controller.rb"
    - "app/controllers/shipments_controller.rb"
    - "app/helpers/application_helper.rb"
    - "app/models/order.rb"

Metrics/ClassLength:
  Max: 150
  Exclude:
    - "app/controllers/orders_controller.rb"
    - "app/controllers/shipments_controller.rb"
    - "app/controllers/clients_controller.rb"
    - "app/controllers/products_controller.rb"
    - "app/models/order.rb"
    - "app/models/product.rb"
    - "app/models/shipment.rb"
    - "app/reports/**/*"
    - "app/services/**/*"

# it would be great to use EnforcedStyle: semantic here but it complains way too much
Style/BlockDelimiters:
  Enabled: false

Style/Documentation:
  Enabled: false

Layout/FirstHashElementIndentation:
  Enabled: false

Style/NumericLiterals:
  Enabled: false

Layout/MultilineOperationIndentation:
  EnforcedStyle: indented

Style/GuardClause:
  Exclude:
    - "app/reports/**/*"
    - "config/**/*"
    - "**/*_spec.rb"
    - "spec/**/*"
    - 'lib/**/*'
    - 'db/migrate/**/*'

Style/SignalException:
  Enabled: false

Layout/SpaceBeforeFirstArg:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/SingleLineBlockParams:
  Enabled: false

Layout/ParameterAlignment:
  Enabled: false

Layout/FirstParameterIndentation:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Style/ConditionalAssignment:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "app/reports/**/*"
    - "config/**/*"
    - "**/*_spec.rb"
    - "spec/**/*"
    - "lib/**/*"
    - "db/queue_schema.rb"
    - "app/services/**/*"

# Lucide SVG rendering accepts a small, explicit set of independently optional
# HTML/link options; a keyword-options object would make call sites less clear.
Metrics/ParameterLists:
  Exclude:
    - "app/helpers/application_helper.rb"

Rails/SkipsModelValidations:
  Enabled: false

Rails/CreateTableWithTimestamps:
  Exclude:
    - "db/migrate/2014*"
    - "db/migrate/2015*"
    # Snapshot rows are immutable child records keyed by their parent snapshot.
    - "db/migrate/20260702010000_create_product_totals_snapshots.rb"

Rails/NotNullColumn:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Rails/FilePath:
  Exclude:
    - "spec/**/*"
    - "lib/tasks/*.rake"

Rails/OutputSafety:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Naming/MemoizedInstanceVariableName:
  Enabled: false

# Domain names like net_15, street_1 are legitimate conventions.
Naming/VariableNumber:
  Enabled: false

Metrics/CyclomaticComplexity:
  Exclude:
    - "app/reports/**/*"
    - "config/**/*"
    - "**/*_spec.rb"
    - "spec/**/*"
    - "lib/**/*"
    - "db/migrate/**/*"
    - "app/models/public_client_user.rb"
    - "app/services/**/*"
    - "app/controllers/clients_controller.rb"
    - "app/controllers/products_controller.rb"
    - "app/helpers/shipments_helper.rb"
    - "app/jobs/exporter_job.rb"
    - "app/models/order.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "app/reports/**/*"
    - "config/**/*"
    - "**/*_spec.rb"
    - "spec/**/*"
    - "lib/**/*"
    - "db/migrate/**/*"
    - "app/services/**/*"
    - "app/controllers/clients_controller.rb"
    - "app/controllers/products_controller.rb"
    - "app/models/order.rb"

Rails/BulkChangeTable:
  Exclude:
    - "db/migrate/**/*"

# Helpers intentionally use instance variables set by controllers.
Rails/HelperInstanceVariable:
  Enabled: false

# Report generators and a few controllers use optional boolean params legitimately.
Style/OptionalBooleanParameter:
  Enabled: false

# api/v1 controllers inherit from ApiController, not ApplicationController.
# otel_traces_controller.rb deliberately skips ApplicationController too --
# it's an unauthenticated telemetry beacon with no Devise session, Pundit
# policy, or CSRF token to check.
Rails/ApplicationController:
  Exclude:
    - "app/controllers/api/**/*"
    - "app/controllers/otel_traces_controller.rb"

# standing_orders is a scoped alias for orders; dependents handled by orders.
Rails/HasManyOrHasOneDependent:
  Exclude:
    - "app/models/client.rb"
    - "app/models/ingredient.rb"
    # File exports are retained when a bakery is removed.
    - "app/models/bakery.rb"

Rails/InverseOf:
  Exclude:
    - "app/models/client.rb"

# Rake task uses method_missing as a simple delegation proxy.
Style/MissingRespondToMissing:
  Exclude:
    - "lib/tasks/**/*"

# Test helper class defined inside a describe block — acceptable pattern.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/**/*"
    # The sync task deliberately keeps its operational configuration local.
    - "lib/tasks/sync_from_production.rake"

# Query objects intentionally use enumerable pipelines; naming each intermediate
# collection would obscure the query's data-flow rather than clarify it.
Style/MultilineBlockChain:
  Exclude:
    - "app/reports/**/*"
