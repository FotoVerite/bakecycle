# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  kickoff:
    class: KickoffJob
    queue: operations
    schedule: every 5 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  clear_solid_queue_failed_jobs:
    # None of our jobs configure retry_on/discard_on, so anything that lands
    # in solid_queue_failed_executions has already exhausted ActiveJob's
    # default retry handling and won't be retried automatically -- unlike
    # clear_finished_in_batches above (which only ever touches successful
    # jobs), Solid Queue has no equivalent auto-prune for the failed side.
    command: "SolidQueue::FailedExecution.discard_all_in_batches(batch_size: 500)"
    schedule: every hour at minute 27
  purge_old_versions:
    class: PurgeOldVersionsJob
    schedule: every day at 3am
  product_graph_data_digest:
    class: ProductGraphDataDigestJob
    queue: operations
    schedule: every day at 6:30am
  shipment_graph_data_digest:
    class: ShipmentGraphDataDigestJob
    queue: operations
    schedule: every day at 6:45am

staging:
  kickoff:
    class: KickoffJob
    queue: operations
    schedule: every 5 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  clear_solid_queue_failed_jobs:
    # None of our jobs configure retry_on/discard_on, so anything that lands
    # in solid_queue_failed_executions has already exhausted ActiveJob's
    # default retry handling and won't be retried automatically -- unlike
    # clear_finished_in_batches above (which only ever touches successful
    # jobs), Solid Queue has no equivalent auto-prune for the failed side.
    command: "SolidQueue::FailedExecution.discard_all_in_batches(batch_size: 500)"
    schedule: every hour at minute 27
  purge_old_versions:
    class: PurgeOldVersionsJob
    schedule: every day at 3am
  product_graph_data_digest:
    class: ProductGraphDataDigestJob
    queue: operations
    schedule: every day at 6:30am
  shipment_graph_data_digest:
    class: ShipmentGraphDataDigestJob
    queue: operations
    schedule: every day at 6:45am
