new_order:
  label: "New Order"
  description: "Start a standing or temporary client order."
  context: "Orders"
  icon: "file-plus"
  route: new_order_path
  permission: client_manage?
new_invoice:
  label: "New Invoice"
  description: "Create an invoice with delivery and product details."
  context: "Invoices"
  icon: "file-plus"
  route: new_shipment_path
  permission: shipping_manage?
daily_recipes:
  label: "Daily Recipes"
  description: "Review or print recipe quantities for a production date."
  context: "Production"
  icon: "clipboard-list"
  route: print_recipes_path
  permission: production_read?
batch_recipes:
  label: "Batch Recipes"
  description: "Plan recipe quantities across a date range."
  context: "Production"
  icon: "calendar-days"
  route: batch_recipes_path
  permission: production_read?
production_runs:
  label: "Production Runs"
  description: "Open scheduled production runs and run sheets."
  context: "Production"
  icon: "list-checks"
  route: production_runs_path
  permission: production_read?
production_checklist:
  label: "Production Checklist"
  description: "Review orders that still need production attention."
  context: "Production"
  icon: "square-check"
  route: production_checklist_path
  permission: production_read?
packing_slips:
  label: "Packing Slips"
  description: "Prepare client packing slips for a delivery date."
  context: "Shipping"
  icon: "file-text"
  route: packing_slips_path
  permission: shipping_read?
delivery_lists:
  label: "Delivery Lists"
  description: "Build route-ready delivery lists for the day."
  context: "Shipping"
  icon: "list-todo"
  route: delivery_lists_path
  permission: shipping_read?
nightly_sign_off:
  label: "Nightly Sign Off"
  description: "Confirm boxes and bags before deliveries leave."
  context: "Shipping"
  icon: "check-check"
  route: nightly_sign_off_path
  permission: shipping_read?
reports:
  label: "Reports"
  description: "Open operational, client, product, and sales reports."
